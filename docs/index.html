<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Call · Agent</title>
<style>
:root{--bg:#0e1424;--card:#151c30;--line:#263050;--txt:#e9edf8;--mut:#8c97b5;--acc:#4f7cff;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1b2750,var(--bg));color:var(--txt);min-height:100vh;display:flex;justify-content:center;padding:24px}
.app{width:100%;max-width:980px;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.call{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
h1{font-size:15px;margin:0;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.orb{position:relative;width:150px;height:150px;margin:8px 0}
.orb .core{position:absolute;inset:20px;border-radius:50%;background:linear-gradient(135deg,#4f7cff,#7c4dff);display:grid;place-items:center;font-size:44px;box-shadow:0 10px 40px #4f7cff55;transition:.2s}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);opacity:.0;transform:scale(.8)}
.orb.listening .ring{animation:rp 1.6s infinite;border-color:var(--ok)}.orb.speaking .ring{animation:rp 1.1s infinite;border-color:var(--acc)}.orb.thinking .ring{animation:rp 2.2s infinite;border-color:var(--warn)}
.orb.listening .core{background:linear-gradient(135deg,#16a34a,#22c55e)}.orb.thinking .core{background:linear-gradient(135deg,#d97706,#f59e0b)}
@keyframes rp{0%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(1.35)}}
#status{font-size:18px;font-weight:600}#sub{color:var(--mut);font-size:13px;min-height:18px}#timer{font-variant-numeric:tabular-nums;color:var(--mut)}
.bars{display:flex;gap:3px;align-items:center;height:34px}.bars i{display:block;width:4px;height:4px;border-radius:2px;background:var(--acc);transition:height .06s}
.btns{display:flex;gap:14px;margin-top:6px}
button{font:inherit;border:0;cursor:pointer}
.round{width:64px;height:64px;border-radius:50%;font-size:24px;color:#fff;display:grid;place-items:center;transition:.15s}
.start{background:var(--ok)}.end{background:var(--bad)}.mute{background:#2a3558}.mute.on{background:var(--warn)}
.round:hover{transform:scale(1.06)}.round:disabled{opacity:.4;cursor:not-allowed;transform:none}
details{width:100%;text-align:left;margin-top:6px}summary{cursor:pointer;color:var(--mut);font-size:13px}
.f{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--mut)}
.f input,.f select{background:#0f1526;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font:inherit;width:100%}
.tr{display:flex;flex-direction:column;height:calc(100vh - 48px);max-height:760px}.tr h1{margin-bottom:12px}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.45;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.m.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}.m.a{align-self:flex-start;background:#222c4a;border-bottom-left-radius:4px}
.m.s{align-self:center;background:none;color:var(--mut);font-size:12px;padding:2px}.m.e{align-self:center;background:#3a1d24;color:#fca5a5;font-size:13px}
.m small{display:block;color:#ffffff88;font-size:11px;margin-top:4px}
.empty{margin:auto;color:var(--mut);text-align:center;font-size:14px}
</style></head><body>
<div class="app">
 <div class="card call">
  <h1 id="title">Voice call</h1>
  <div class="orb" id="orb"><div class="ring"></div><div class="core">🎙️</div></div>
  <div id="status">Ready to call</div><div id="sub">Press the green button and start talking.</div>
  <div id="timer">00:00</div>
  <div class="bars" id="bars"></div>
  <div class="btns">
   <button class="round mute" id="mute" title="Mute microphone" disabled>🔇</button>
   <button class="round start" id="start" title="Start call">📞</button>
   <button class="round end" id="end" title="End call" style="display:none">⏹</button>
  </div>
  <details><summary>Call settings</summary>
   <div id="gw" style="display:none"><div class="f"><label>Gateway URL</label><input id="gwbase" placeholder="https://dev.ai-gateway.kapitalbank.az"></div>
   <div class="f"><label>Gateway API key</label><input id="gwkey" type="password" autocomplete="off" placeholder="sk-… (stored only in this browser)"></div></div>
   <div class="f"><label>Voice</label><input id="voice"></div>
   <div class="f"><label>Language hint</label><input id="lang" value="az" placeholder="e.g. en, az (blank = auto)"></div>
   <div class="f"><label>Silence (ms)</label><input id="sil" type="number" value="1000" min="400" max="3000" step="100"></div>
   <div class="f"><label>Mic sensitivity</label><select id="sens"><option value="0.7">High</option><option value="1" selected>Normal</option><option value="1.6">Low (noisy room)</option></select></div>
   <div class="f"><label>Barge-in</label><select id="barge"><option value="1" selected>On (interrupt agent by speaking)</option><option value="0">Off (use headphones if on)</option></select></div>
  </details>
 </div>
 <div class="card tr"><h1>Live transcript</h1><div id="log"><div class="empty">Your conversation will appear here.</div></div></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
